<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmileSchool</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <a href="#" class="header-logo">
            <img src="./images/logo.png" alt="">
            <span>SmileSchool</span>
        </a>

        <nav>
            <a href="#">COURSES</a>
            <a href="#">PRICING</a>
            <a href="#">LOGIN</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Get schooled</h1>

                <div class="hero-keywords">
                    <span>SMILES</span>
                    <span>GRIN</span>
                    <span>LAUGH</span>
                </div>

                <button type="button">
                    REGISTER FOR FREE
                </button>
            </div>

            <div class="professionals">
                <h2>
                    <span>Learn</span> from the pros
                </h2>

                <div class="professionals-list">
                    <article>
                        <img
                            src="./images/1.png"
                            alt="Phillip Massey"
                        >
                        <h3>Phillip Massey</h3>
                        <p>
                            « Smile of the year »<br>
                            2018 - 2019
                        </p>
                    </article>

                    <article>
                        <img
                            src="./images/2.png"
                            alt="Nannie Lawrence"
                        >
                        <h3>Nannie Lawrence</h3>
                        <p>
                            Best « little smile »<br>
                            2017
                        </p>
                    </article>

                    <article>
                        <img
                            src="./images/3.png"
                            alt="Bruce Walters"
                        >
                        <h3>Bruce Walters</h3>
                        <p>
                            Best « Friend Smile »<br>
                            live performance 2019
                        </p>
                    </article>

                    <article>
                        <img
                            src="./images/4.png"
                            alt="Henry Hughes"
                        >
                        <h3>Henry Hughes</h3>
                        <p>
                            « 24h smiles » winner<br>
                            2016 - 2019
                        </p>
                    </article>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
