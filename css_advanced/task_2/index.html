<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmileSchool - Homepage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="header-container">
            <a href="#" class="logo">
                <img src="images/logo.png" alt="SmileSchool logo">
            </a>

            <nav aria-label="Main navigation">
                <a href="#">COURSES</a>
                <a href="#">PRICING</a>
                <a href="#">LOGIN</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Banner -->
        <section class="banner">

            <div class="banner-intro">
                <h1>Get schooled</h1>

                <div class="banner-tags">
                    <span>SMILES</span>
                    <span>GRIN</span>
                    <span>LAUGH</span>
                </div>

                <button type="button">
                    REGISTER FOR FREE
                </button>
            </div>

            <div class="pros">
                <h2><span>Learn</span> from the pros</h2>

                <div class="pros-list">
                    <div class="pro-card">
                        <img src="images/profile1.jpg" alt="Phillip Massey">
                        <h3>Phillip Massey</h3>
                        <p>« Smile of the year »<br>2018 - 2019</p>
                    </div>

                    <div class="pro-card">
                        <img src="images/profile2.jpg" alt="Nannie Lawrence">
                        <h3>Nannie Lawrence</h3>
                        <p>Best « little smile »<br>2017</p>
                    </div>

                    <div class="pro-card">
                        <img src="images/profile3.jpg" alt="Bruce Walters">
                        <h3>Bruce Walters</h3>
                        <p>Best « Friend Smile »<br>live performance 2019</p>
                    </div>

                    <div class="pro-card">
                        <img src="images/profile4.jpg" alt="Henry Hughes">
                        <h3>Henry Hughes</h3>
                        <p>« 24h smiles » winner<br>2016 - 2019</p>
                    </div>
                </div>
            </div>

        </section>
    </main>

</body>
</html>
